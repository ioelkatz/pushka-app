name: pushka_app
description: "Pushka - App de donaciones y tzedaka digital."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.2+4

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_animate: ^4.5.0
  url_launcher: ^6.2.5
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^17.2.4
  # v7 migration (2026-07-27): v6 was deprecated and its native flow on
  # Android 14+ went through the legacy GoogleApiClient path which returns
  # null after the account chooser when idToken issuance fails. v7 uses
  # Android's Credential Manager (system-level, replaces the plugin's own
  # UI) which is Google's official supported flow post Android 14. API is
  # completely different — see auth_controller.signInWithGoogle + the
  # GoogleSignIn.instance.initialize() call in app_initializer.dart.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  country_picker: ^2.0.26
  timezone: ^0.9.4
  flutter_stripe: ^12.6.0
  cloud_functions: ^6.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_app_check: ^0.4.0
  share_plus: ^13.1.0
  local_auth: ^3.0.1
  intl: 0.20.2
  audioplayers: ^6.6.0
  shimmer: ^3.0.0
  confetti: ^0.8.0
  connectivity_plus: ^7.0.0
  lottie: ^3.1.0
  fl_chart: ^1.2.0
  smooth_page_indicator: ^2.0.1
  flutter_haptic_feedback: ^1.0.0
  google_fonts: ^8.1.0
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  firebase_storage: ^13.0.0
  app_links: ^7.0.0
  flutter_svg: ^2.0.10+1
  # iOS App Tracking Transparency — required by Apple for any SDK that may
  # use IDFA-equivalents (Firebase Analytics, Crashlytics). On Android this
  # package is a silent no-op so it's safe to call unconditionally.
  app_tracking_transparency: ^2.0.6+1
  # Disk-cached network images — used for tenant org logos rendered in the
  # account switcher / join screens / tenant code screen. Without caching
  # every screen mount re-downloads the same logo from Firebase Storage,
  # spending bandwidth and adding visible flicker on slow networks.
  cached_network_image: ^3.4.1
  flutter_timezone: ^5.1.0
  flutter_stripe_web: ^7.6.0
  # Runtime notification permissions on Android 13+ (POST_NOTIFICATIONS).
  # We use permission_handler because it distinguishes `denied` from
  # `permanentlyDenied` — flutter_local_notifications' request returns a
  # plain bool that treats "user checked Don't ask again" identically to a
  # first-time denial. That distinction drives the UX in reminders_screen:
  # when permanently denied we open the app's system settings directly
  # via `openAppSettings()` instead of firing a doomed request that returns
  # false without ever showing the OS prompt.
  permission_handler: ^11.3.1
  package_info_plus: ^10.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.0
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/images/confetti/
    - assets/animations/
    - assets/icons/


  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
  web:
    generate: true
  windows:
    generate: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#060E22"
  android_12:
    color: "#060E22"
  ios: true
  web: true


