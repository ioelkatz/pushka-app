# Codemagic CI workflows for Pushka iOS builds.
#
# Two workflows:
#   - ios-testflight-dev  → Stripe test keys + Firebase test project +
#                           TestFlight upload. Daily-driver for QA on
#                           iPhone without owning a Mac.
#   - ios-testflight-prod → Stripe live keys + Firebase prod project +
#                           TestFlight upload. Last stop before App Store.
#
# Both workflows produce the same bundle ID (`com.pushka.app`). Codemagic
# manages the iOS distribution cert + provisioning profile via the Apple
# Developer integration. Per-Firebase-project secrets are bound through
# environment groups so the same source tree can target either project.
#
# ---------------------------------------------------------------------------
# Setup checklist (one-time, in the Codemagic web UI)
# ---------------------------------------------------------------------------
#
# 1. Codemagic → Apps → Add app → connect this GitHub repo.
#
# 2. Generate an App Store Connect API key:
#    App Store Connect → Users and Access → Keys → "+" → role "App Manager".
#    Download the .p8 file, note Key ID + Issuer ID.
#    Codemagic → Teams → Integrations → Apple Developer Portal → "Connect"
#    and paste the three values.
#
# 3. Codemagic → Code signing identities → "Apple Developer Portal API"
#    integration. Codemagic auto-creates an iOS distribution certificate
#    + provisioning profile when the workflow runs.
#
# 4. Generate firebase_options_{dev,prod}.dart locally on Windows:
#       dart pub global activate flutterfire_cli
#       flutterfire configure --project=pushka-app-ioel-test \
#         --platforms=ios,android --out=lib/firebase_options_dev.dart --yes
#       # rename class `DefaultFirebaseOptions` → `DevFirebaseOptions`
#       flutterfire configure --project=pushka-app-ioel \
#         --platforms=ios,android --out=lib/firebase_options_prod.dart --yes
#       # rename class `DefaultFirebaseOptions` → `ProdFirebaseOptions`
#    Base64-encode each:
#       certutil -encode lib/firebase_options_dev.dart  dev_b64.txt   # Windows
#       certutil -encode lib/firebase_options_prod.dart prod_b64.txt
#    (or `base64 -i lib/firebase_options_dev.dart` on Mac/Linux)
#
# 5. Download GoogleService-Info.plist from Firebase Console for BOTH
#    iOS apps (one per project). Base64-encode each.
#
# 6. Codemagic → App settings → Environment variables → create groups:
#
#    `pushka_dev_secrets` (bound to ios-testflight-dev):
#      STRIPE_PUBLISHABLE_KEY  pk_test_…
#      STRIPE_MERCHANT_ID      merchant.com.pushka.app
#      GOOGLE_SERVICE_INFO_PLIST_B64  <base64 of test project plist>
#      FIREBASE_OPTIONS_DEV_DART_B64  <base64 of firebase_options_dev.dart>
#      FIREBASE_OPTIONS_PROD_DART_B64 <base64 of firebase_options_prod.dart>
#
#    `pushka_prod_secrets` (bound to ios-testflight-prod):
#      STRIPE_PUBLISHABLE_KEY  pk_live_…
#      STRIPE_MERCHANT_ID      merchant.com.pushka.app
#      GOOGLE_SERVICE_INFO_PLIST_B64  <base64 of prod project plist>
#      FIREBASE_OPTIONS_DEV_DART_B64  <base64 of firebase_options_dev.dart>
#      FIREBASE_OPTIONS_PROD_DART_B64 <base64 of firebase_options_prod.dart>
#
#    Both _DART_B64 vars exist in both groups because the source tree
#    imports both files unconditionally — the workflow's ENV dart-define
#    decides which one is loaded at runtime.
#
# 7. First push to `dev` branch triggers `ios-testflight-dev` automatically.
#    Build → upload to TestFlight → install on iPhone via TestFlight app.
#    `ios-testflight-prod` is manual-trigger only.
#
# References:
#   https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#   https://docs.codemagic.io/yaml-publishing/app-store-connect/

definitions:
  scripts:
    - &decode_secret_files
      name: Decode Firebase + Dart files from secure env
      script: |
        set -e
        if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
          echo "ERROR: GOOGLE_SERVICE_INFO_PLIST_B64 missing — check env group binding."
          exit 1
        fi
        echo "$GOOGLE_SERVICE_INFO_PLIST_B64"   | base64 --decode > ios/Runner/GoogleService-Info.plist
        echo "$FIREBASE_OPTIONS_DEV_DART_B64"   | base64 --decode > lib/firebase_options_dev.dart
        echo "$FIREBASE_OPTIONS_PROD_DART_B64"  | base64 --decode > lib/firebase_options_prod.dart
        ls -la ios/Runner/GoogleService-Info.plist lib/firebase_options_dev.dart lib/firebase_options_prod.dart
        # Sanity check: classes must be present so the build compiles.
        grep -q "class DevFirebaseOptions"  lib/firebase_options_dev.dart  || { echo "DevFirebaseOptions missing"; exit 1; }
        grep -q "class ProdFirebaseOptions" lib/firebase_options_prod.dart || { echo "ProdFirebaseOptions missing"; exit 1; }

    - &flutter_pub_get
      name: Install Flutter dependencies
      script: |
        flutter --version
        flutter pub get

    - &cocoapods_install
      name: Install CocoaPods
      script: |
        # First-build path: Flutter generates `ios/Podfile` lazily as part
        # of `flutter build ipa`. If the file isn't there yet, skip the
        # manual `pod install` and let the build step handle pods. On
        # subsequent runs Codemagic's caches will have the Podfile +
        # repos warmed up so `pod install --repo-update` is fast.
        if [ -f ios/Podfile ]; then
          cd ios && pod install --repo-update
        else
          echo "ios/Podfile not present yet — flutter build will generate it."
        fi

    - &codemagic_signing
      name: Set up Codemagic-managed iOS signing
      script: |
        # Auto-issues an App Store distribution cert + provisioning profile
        # for $BUNDLE_ID via the App Store Connect API integration.
        keychain initialize
        app-store-connect fetch-signing-files \
          "$BUNDLE_ID" --type IOS_APP_STORE \
          --create
        keychain add-certificates
        xcode-project use-profiles

    - &bump_build_number
      name: Bump build number from App Store Connect
      script: |
        BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID") + 1))
        echo "Using build number $BUILD_NUMBER"
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

workflows:
  ios-testflight-dev:
    name: iOS TestFlight (dev — Stripe test, Firebase test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - pushka_dev_secrets
      vars:
        BUNDLE_ID: com.pushka.app
        XCODE_PROJECT: ios/Runner.xcodeproj
        XCODE_SCHEME: Runner
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: codemagic
    scripts:
      - *flutter_pub_get
      - *decode_secret_files
      - *cocoapods_install
      - *codemagic_signing
      - *bump_build_number
      - name: Build IPA (dev — test Stripe + test Firebase)
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=ENV=dev \
            --dart-define=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --dart-define=STRIPE_MERCHANT_ID="$STRIPE_MERCHANT_ID" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  ios-testflight-prod:
    name: iOS TestFlight (prod — Stripe live, Firebase prod)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - pushka_prod_secrets
      vars:
        BUNDLE_ID: com.pushka.app
        XCODE_PROJECT: ios/Runner.xcodeproj
        XCODE_SCHEME: Runner
    triggering:
      # Manual-trigger only. Avoids auto-uploading a "prod" build on every
      # commit to dev — promotion to prod is a deliberate action.
      events: []
    integrations:
      app_store_connect: codemagic
    scripts:
      - *flutter_pub_get
      - *decode_secret_files
      - *cocoapods_install
      - *codemagic_signing
      - *bump_build_number
      - name: Build IPA (prod — live Stripe + prod Firebase)
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --dart-define=STRIPE_MERCHANT_ID="$STRIPE_MERCHANT_ID" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  # ---------------------------------------------------------------------------
  # ios-altstore-debug — UI-only smoke test path (no Apple Developer needed)
  # ---------------------------------------------------------------------------
  #
  # Builds a DEBUG, UNSIGNED IPA pointing at the dev Firebase project + Stripe
  # test keys. The IPA is published as a build artifact. From there:
  #
  #   1. Download the .ipa from the Codemagic build page.
  #   2. Install AltServer for Windows (https://altstore.io) + iCloud +
  #      iTunes (Microsoft Store version both work).
  #   3. Connect the iPhone via USB, trust the computer.
  #   4. Drag the .ipa onto AltStore. Sign in with your free Apple ID when
  #      prompted — AltStore re-signs with a free 7-day provisioning profile
  #      and pushes the install to the phone.
  #   5. Re-sign every 7 days (AltServer auto-refreshes while the iPhone is
  #      on the same Wi-Fi network as the Windows machine).
  #
  # WHAT WORKS on this path:
  #   - Auth (email/password, Apple Sign-In)
  #   - Firestore reads/writes
  #   - All UI / navigation / settings
  #   - Donations via the credit-card form
  #   - App Check via the debug provider (debug build → AppleDebugProvider
  #     prints a token; register it at Firebase Console → App Check →
  #     Manage debug tokens for `pushka-app-ioel-test`).
  #
  # WHAT DOESN'T WORK with a free Apple ID:
  #   - Apple Pay (needs paid merchant ID — sheet still shows but charge fails)
  #   - Push notifications (needs APNs cert)
  #   - Google Sign-In (its OAuth callback URL scheme requires a registered
  #     provisioning profile that free signing strips out)
  #   - App Attest production attestation (sandbox only, debug provider used
  #     instead — that's fine for testing)
  #
  # Triggered MANUALLY from the Codemagic UI. Avoid auto-triggering on push
  # so we don't burn free-tier macOS minutes on every commit.

  ios-altstore-debug:
    name: iOS unsigned debug IPA (AltStore sideload, no Apple Developer)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - pushka_dev_secrets   # STRIPE_PUBLISHABLE_KEY (pk_test),
                               # GOOGLE_SERVICE_INFO_PLIST_B64 (test project),
                               # FIREBASE_OPTIONS_*_DART_B64
      vars:
        BUNDLE_ID: com.pushka.app
        XCODE_PROJECT: ios/Runner.xcodeproj
        XCODE_SCHEME: Runner
    triggering:
      events: []
    scripts:
      - *flutter_pub_get
      - *decode_secret_files
      - *cocoapods_install
      - name: Disable Swift Package Manager (force CocoaPods for Firebase)
        script: |
          # Flutter auto-enables SPM when Xcode supports it, but the SPM
          # resolver picks a firebase-ios-sdk version that's older than what
          # cloud_firestore 6.3.x bridges to. Surface symptom is opaque ARC
          # errors at archive time:
          #   No visible @interface for 'FIRCollectionSourceStageBridge'
          #     declares the selector 'initWithRef:firestore:'
          # That bridge class lives in firebase-ios-sdk 12.x (new Pipelines
          # API). CocoaPods resolution via the .podspec pins the right
          # version, so we fall back to pods until the Flutter Firebase
          # plugins ship a consistent SPM manifest.
          flutter config --no-enable-swift-package-manager
          flutter config --list | grep -i swift || true

      - name: Build unsigned debug IPA (AltStore sideload target)
        script: |
          set -euo pipefail
          # Strip ANY whitespace/newlines that Codemagic's Secure env var
          # injection sometimes appends to the value. Without this, Flutter's
          # CLI parser sees the trailing \n inside `--dart-define=KEY=value\n`
          # and stops recognizing the flag — the next iteration treats the
          # entire token as a positional target file, surfacing as:
          #   Target file "--dart-define=STRIPE_PUBLISHABLE_KEY=********" not found.
          # Same root cause as the printf-vs-echo gotcha documented in CLAUDE.md
          # for Firebase secrets — pipelines that handle "secure" values often
          # add a trailing newline somewhere upstream.
          STRIPE_KEY_CLEAN="$(printf '%s' "$STRIPE_PUBLISHABLE_KEY" | tr -d '[:space:]')"
          # `--no-codesign` skips signing entirely; AltStore re-signs on the
          # Windows side with the user's free Apple ID. `STRIPE_MERCHANT_ID`
          # is intentionally NOT passed: without a merchant ID Apple Pay is
          # silently disabled and the sheet falls back to credit-card-only,
          # which is what AltStore builds support.
          #
          # `--profile` (NOT `--debug`) because Flutter blocks launching debug
          # iOS builds from the home screen on iOS 14+ with the message
          # "debug mode Flutter apps can only be launched from Flutter tooling,
          # IDEs with Flutter plugins or from Xcode". Profile builds DO launch
          # standalone, AND still use the AppleDebugProvider for App Check —
          # see lib/app/app_initializer.dart: the gate is `!kReleaseMode`,
          # which covers profile mode. So we get a launchable bundle plus the
          # debug App Check provider that AltStore-grade free signing requires.
          #
          # Single-line invocation (no `\` continuations) so the build is
          # robust to any YAML→bash transformation that might eat the
          # backslashes — saw a build where exactly that failed.
          flutter build ipa --profile --no-codesign --dart-define=ENV=dev --dart-define=STRIPE_PUBLISHABLE_KEY="$STRIPE_KEY_CLEAN"

          # `flutter build ipa --no-codesign` produces a Runner.xcarchive but
          # explicitly SKIPS the IPA export step ("Codesigning disabled with
          # --no-codesign, skipping IPA."). For AltStore sideload we don't need
          # signing — AltStore re-signs the IPA on the Windows side with the
          # user's free Apple ID — so we package the .xcarchive's .app into a
          # well-formed unsigned .ipa manually here.
          #
          # An .ipa is just a zip with `Payload/<App>.app/` at the root. Apple
          # tooling adds extra fluff (SwiftSupport, Symbols), but AltStore only
          # needs the Payload bundle.
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle at $APP_PATH but it doesn't exist."
            ls -la build/ios/archive/ || true
            ls -la build/ios/archive/Runner.xcarchive/Products/Applications/ || true
            exit 1
          fi
          mkdir -p build/ios/ipa
          rm -rf /tmp/altstore_payload
          mkdir /tmp/altstore_payload
          cp -R "$APP_PATH" /tmp/altstore_payload/
          mv /tmp/altstore_payload "/tmp/Payload"
          (cd /tmp && zip -qr "$CM_BUILD_DIR/build/ios/ipa/Runner.ipa" Payload)
          rm -rf /tmp/Payload
          ls -la build/ios/ipa/
          echo "IPA size: $(du -h build/ios/ipa/Runner.ipa | cut -f1)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
