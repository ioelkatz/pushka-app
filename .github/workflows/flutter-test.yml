name: Flutter CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match the team's local toolchain (CLAUDE.md notes
          # 3.41.9 / Dart 3.11.5). Bump in tandem with local upgrades.
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The per-env Firebase option files are gitignored (each dev generates
      # their own with flutterfire configure — see CLAUDE.md). CI doesn't
      # need real keys to run static analysis or unit tests, just files that
      # expose the symbols `lib/firebase_options.dart` imports. Stubs do.
      - name: Generate Firebase option stubs for analysis
        run: |
          cat > lib/firebase_options_dev.dart <<'STUB'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DevFirebaseOptions {
            static const FirebaseOptions _stub = FirebaseOptions(
              apiKey: 'ci-stub',
              appId: 'ci-stub',
              messagingSenderId: 'ci-stub',
              projectId: 'ci-stub',
            );
            static FirebaseOptions get currentPlatform => _stub;
          }
          STUB
          cat > lib/firebase_options_prod.dart <<'STUB'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class ProdFirebaseOptions {
            static const FirebaseOptions _stub = FirebaseOptions(
              apiKey: 'ci-stub',
              appId: 'ci-stub',
              messagingSenderId: 'ci-stub',
              projectId: 'ci-stub',
            );
            static FirebaseOptions get currentPlatform => _stub;
          }
          STUB

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true # warning-only for now; remove once codebase is fully formatted

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

  functions-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true # warning-only until the team commits to lint-clean baseline

      - name: Test
        run: npm test --if-present
